<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Afacad:wght@400..700&display=swap');
  * { box-sizing: border-box; }
  html, body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  font-family: Inter, Afacad, sans-serif;
  color: #212121;
  background: #fff;
  overflow: hidden;
  position: relative;
}

.weather {
  position: absolute;
  top: 35px;
  right: 35px;
  text-align: right;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0;
}

.temperature {
  font-size: 32px;
  line-height: 100%;
  font-weight: 700;
  letter-spacing: 0;
}

.city {
  color: #6E6CDF;
  font-size: 20px;
  line-height: 100%;
  font-weight: 700;
  letter-spacing: 0;
}

main {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(621.45px, calc(100vw - 36px));
  display: flex;
  flex-direction: column;
  align-items: center;
}

.clock {
  font-size: 74px;
  line-height: 100%;
  font-weight: 700;
  letter-spacing: 0;
}

.greeting {
  margin-top: 9px;
  color: #6E6CDF;
  font-size: 36px;
  line-height: 1;
  font-weight: 700;
  letter-spacing: 0;
}

.search-wrap {
  width: 100%;
  margin-top: 55.65px;
}

form.search {
  height: 65px;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  background: #fafafa;
  border: 1px solid #eeeeee;
  border-radius: 14px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .015);
}

.search svg {

  flex: none;
  color: #bdbdbd;
  height: 28px;
  width: 28px;
}

.search input {
  width: 100%;
  min-width: 0;
  outline: none;
  border: 0;
  background: transparent;
  font: 400 20px Inter, Afacad, sans-serif;
  color: #9e9e9e;
}

.search input::placeholder {
  color: #9e9e9e;
  opacity: 1;
}

.shortcuts {
  width: 100%;
  display: flex;
  justify-content: space-around;
  align-items: center;
  margin-top: 42px;
  gap: 20px;
}

.shortcut {
  width: 65px;
  height: 65px;
  flex: 0 0 65px;
  border: 1px solid #eeeeee;
  border-radius: 18px;
  background: #fafafa;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #222;
  text-decoration: none;
  transition: background .15s, transform .15s;
}

.shortcut:hover {
  background: #ffffff;
  transform: translateY(-2px);
}

.shortcut svg {
  width: 32.5px;
  height: 32.5px;
  display: block;
}

.shortcut.add {
  color: #bcbcbc;
}

@media (max-width: 600px) {

  .weather {
    top: 20px;
    right: 24px;
    gap: 0;
  }

  .temperature {
    font-size: 22px;
  }

  .city {
    font-size: 14px;
  }

  main {
    bottom:225px;
    width: min(345px, calc(100vw - 36px));
    transform: translate(-50%, -50%);
  }

  .clock {
    font-size: 48px;
    letter-spacing: 0;
  }

  .greeting {
    margin-top: 8px;
    font-size: 24px;
    letter-spacing: 0;
  }

  .search-wrap {
    margin-top: 215.5px;
  }

  form.search {
    height: 57px;
    border-radius: 16px;
    padding: 0 18px;
    gap: 9px;
  }

  .search input {
    font-size: 18px;
  }

  .shortcuts {
    margin-top: 18px;
    gap: 48x;
    justify-content: space-between;
  }

  .shortcut {
    width: 48px;
    height: 48px;
    flex-basis: 48px;
    border-radius: 16px;
  }

  .shortcut svg {
    width: 19px;
    height: 19px;
  }

  .shortcut.linkedin,
  .shortcut.add {
    display: none;
  }
} 
</style>
